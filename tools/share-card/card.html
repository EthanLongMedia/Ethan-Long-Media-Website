<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden;background:#0b0a0f}
  .card{
    position:relative;width:1200px;height:630px;overflow:hidden;
    font-family:'Inter',-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;
    /* sampled straight off the original card: #161521 corner, #2f2d47 glow,
       #0b0a0f at its darkest just right of the type */
    background:
      radial-gradient(ellipse 660px 440px at 200px 320px, #33304d 0%, rgba(47,45,71,0) 72%),
      linear-gradient(112deg, #1a1926 0%, #14131f 40%, #0b0a0f 78%);
  }
  /* The shooter sits at the LEFT edge of the source frame, so putting him on
     the right of a landscape card means the photo itself has to start right of
     centre. The mask feathers that edge into the background so it reads as a
     deliberate blend rather than a pasted rectangle. Scale is chosen to fit him
     ball-to-shoes in 630px, which the old card couldn't do — it cropped him. */
  .shot{
    position:absolute; left:722px; top:-30px; width:478px; height:850px;
    object-fit:cover; object-position:left top;
    /* The shooter sits only ~66px from the frame's left edge, so the blend has
       to happen inside that margin — any wider and it eats into him. Width is
       set so the photo lands exactly on the card's right edge, and this scale
       fits him ball-to-shoes, which the old card was too tight to do. */
    -webkit-mask-image:linear-gradient(90deg, rgba(0,0,0,0) 0px, #000 70px);
            mask-image:linear-gradient(90deg, rgba(0,0,0,0) 0px, #000 70px);
  }
  /* Only a soft shoulder where the photo begins — deliberately not a full-width
     wash, or it flattens the violet glow the original card has on the left. */
  .scrim{
    position:absolute; inset:0;
    background:linear-gradient(90deg,
      rgba(11,10,15,0) 0%, rgba(11,10,15,0) 49%,
      rgba(11,10,15,.55) 59%, rgba(11,10,15,0) 74%);
  }
  /* The photo's top-left corner is bright gym ceiling butting straight into a
     near-black background, which reads as a hard vertical seam. The horizontal
     mask can't fix it (widening it would eat the shooter), so this fades just
     that corner into the same colour the background gradient is at x=700. */
  .blend{
    position:absolute; left:708px; top:0; width:320px; height:300px;
    background:linear-gradient(163deg,
      #100f18 0%, rgba(16,15,24,.88) 22%, rgba(16,15,24,.45) 46%, rgba(16,15,24,0) 70%);
  }
  .copy{position:absolute; inset:0}
  .wordmark{
    position:absolute; left:74px; top:106px;
    font-size:90px; font-weight:800; letter-spacing:-0.4px; line-height:1;
    color:#f4efe6; white-space:nowrap;
  }
  .rule{position:absolute; left:78px; top:225px; width:187px; height:3px; background:#f4efe6}
  .media{
    position:absolute; left:80px; top:243px;
    font-size:36px; font-weight:800; letter-spacing:.47em; line-height:1;
    color:#8b7fe8;
  }
  .tag{
    position:absolute; left:74px; top:324px;
    font-size:28px; font-weight:700; letter-spacing:-0.1px; line-height:1;
    color:#f4efe6; white-space:nowrap;
  }
  .stats{position:absolute; left:73px; top:421px; display:flex; gap:70px}
  .stat b{
    display:block; font-size:55px; font-weight:800; letter-spacing:-1px;
    line-height:1; color:#f4efe6;
  }
  .stat span{
    display:block; margin-top:20px; margin-left:2px;
    font-size:14px; font-weight:700; letter-spacing:.19em; line-height:1;
    color:#8b7fe8;
  }
  .foot{
    position:absolute; left:76px; top:551px;
    font-size:15px; font-weight:600; letter-spacing:.228em; line-height:1;
    color:rgba(244,239,230,.55);
  }
</style></head>
<body>
  <div class="card">
    <img class="shot" src="shot.jpg" alt="">
    <div class="blend"></div>
    <div class="scrim"></div>
    <div class="copy">
      <div class="wordmark">ETHAN LONG</div>
      <div class="rule"></div>
      <div class="media">MEDIA</div>
      <div class="tag">Basketball film that gets players seen</div>
      <div class="stats">
        <div class="stat"><b>1.2M</b><span>INSTAGRAM</span></div>
        <div class="stat"><b>934.8K</b><span>TIKTOK</span></div>
      </div>
      <div class="foot">ONE CUT &middot; BOTH PLATFORMS &middot; MID-MICHIGAN</div>
    </div>
  </div>
</body></html>
